<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">CLIProxy Usage for Orca</title><desc id="desc">A calm view of your Codex and Claude usage, across your hosts.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17252b"/><stop offset="1" stop-color="#101419"/></linearGradient><linearGradient id="mint"><stop stop-color="#74e2b0"/><stop offset="1" stop-color="#72b9d7"/></linearGradient></defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<circle cx="1030" cy="45" r="255" fill="#86e6c3" opacity=".035"/><circle cx="1090" cy="465" r="280" fill="#79b4e3" opacity=".035"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect x="64" y="60" width="122" height="30" rx="15" fill="#2a3c40"/><text x="125" y="80" text-anchor="middle" fill="#9de6c8" font-size="13" font-weight="600" letter-spacing="2">FOR ORCA</text>
<text x="64" y="174" fill="#f0f6f4" font-size="58" font-weight="700" letter-spacing="-2">CLIProxy Usage</text>
<text x="67" y="226" fill="#b4c5cb" font-size="23">Your accounts. Your limits. One clear view.</text>
<text x="67" y="298" fill="#88a3ad" font-size="17">Codex + Claude</text><text x="67" y="330" fill="#88a3ad" font-size="17">Local + SSH hosts</text>
<path d="M67 398h280" stroke="#344b51"/><text x="67" y="432" fill="#a5bbb8" font-size="15">Built to stay out of your way.</text>
<rect x="690" y="70" width="420" height="360" rx="20" fill="#202c31" stroke="#3a4b50"/>
<circle cx="719" cy="97" r="4" fill="#80999c"/><circle cx="734" cy="97" r="4" fill="#80999c"/><circle cx="749" cy="97" r="4" fill="#80999c"/>
<text x="722" y="148" fill="#b3c9cc" font-size="16">A little room to keep building.</text>
<path d="M772 318a128 128 0 0 1 256 0" fill="none" stroke="#38474d" stroke-width="19" stroke-linecap="round"/>
<path d="M772 318a128 128 0 0 1 118-127" fill="none" stroke="url(#mint)" stroke-width="19" stroke-linecap="round"/>
<text x="900" y="294" text-anchor="middle" fill="#eef6f2" font-size="49" font-weight="600">28%</text><text x="900" y="325" text-anchor="middle" fill="#9ab6b8" font-size="15">illustrative usage</text>
<text x="900" y="389" text-anchor="middle" fill="#a8c0c3" font-size="15">Less guessing. More making.</text>
